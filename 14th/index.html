<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diving Deep Into JavaScript</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: black;
      }
      .cont {
        width: 50%;
        margin: 100px auto;

        padding: 50px;
        border-radius: 10px;
        background-color: beige;
      }
      input {
        width: 70%;
        padding: 10px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid #ccc;
      }
      button {
        padding: 10px 15px;
        font-size: 16px;
        margin-left: 10px;
        margin-top: 10px;
        cursor: pointer;
        border-radius: 8px;
        border: none;
        background-color: #28a745;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
      }
    </style>
    <script src="main..js" defer></script>
  </head>
  <body>
    <div class="cont">
      <h1>Todo App</h1>
      <form action="">
        <input
          type="text"
          name="todo"
          id=""
          placeholder="Enter a task for today"
        />
        <button type="submit">Add Task</button>
      </form>
      <ul></ul>
      <p id="message">No tasks added for today</p>
    </div>
  </body>
</html>
